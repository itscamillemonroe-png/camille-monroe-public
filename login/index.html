<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><meta name="robots" content="noindex"><title>Member Access | Camille Monroe</title><link rel="stylesheet" href="/assets/style.css?v=20260917-1"></head><body data-page="login"><nav class="nav"><div class="wrap navin"><a class="brand" href="/">CAMILLE MONROE</a><div class="navlinks"><a href="/">Home</a><a href="/#feed">Feed</a><a href="/links/">Links</a></div></div></nav><main class="authPage"><section class="authCard"><div class="eyebrow">Private access</div><h1>Member access</h1><p class="authIntro">Sign in or request membership. Every new request requires a profile picture and Camille’s approval.</p><div class="authTabs"><button type="button" class="active" data-auth-tab="login">Sign in</button><button type="button" data-auth-tab="signup">Request access</button></div><div id="loginPanel"><form id="loginForm" class="authForm"><label>Email<input id="email" type="email" autocomplete="email" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button class="btn primary wide" type="submit">Sign in</button></form></div><div id="signupPanel" hidden><form id="signupForm" class="authForm"><label>Name<input id="signupName" type="text" autocomplete="name" required></label><label>Email<input id="signupEmail" type="email" autocomplete="email" required></label><label>Password<input id="signupPassword" type="password" autocomplete="new-password" minlength="8" required></label><label>Profile picture<input id="profilePhoto" type="file" accept="image/jpeg,image/png,image/webp" required><small>Clear photo of you · JPG, PNG, or WebP · 8 MB maximum</small></label><label class="checkRow"><input id="ageConfirmed" type="checkbox" required><span>I confirm I am 18 or older.</span></label><button class="btn primary wide" type="submit">Request access</button></form></div><div id="status" class="formStatus" aria-live="polite"></div><p class="authFine">A profile picture and owner approval unlock only the SFW member experience. Adult content requires a separate compliant 18+ check.</p></section></main><script type="module" src="/assets/member.js?v=20260917-1"></script></body></html>
